<!doctype html>
<html lang="en" data-theme="dark" data-motion="on">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cloudflare AI Chat</title>
    <style>
      :root {
        --radius: 12px;
        --border:#e5e7eb;
        --text:#0f172a;
        --muted:#6b7280;
        --card:#ffffffcc;
        --chip:#f3f4f6;
        --btn:#2563eb;
        --btn-hover:#1e40af;
        --user:#2563eb;
        --bot:#16a34a;
        --shadow: 0 10px 30px rgba(0,0,0,0.15);
      }
      html[data-theme="dark"] {
        --border:#2a2f3a;
        --text:#e5e7eb;
        --muted:#9aa2b1;
        --card:#0b1220cc;
        --chip:#111827;
        --btn:#3b82f6;
        --btn-hover:#1d4ed8;
        --user:#60a5fa;
        --bot:#86efac;
        --shadow: 0 10px 30px rgba(0,0,0,0.35);
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        color: var(--text);
        font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, Inter, sans-serif;
        overflow: hidden; /* canvas background */
      }

      /* ===== Background layers ===== */
      .bg {
        position: fixed; inset: 0; z-index: -3; overflow: hidden;
      }
      /* animated gradient blob layer */
      .bg::before {
        content: "";
        position: absolute; inset: -40%;
        background:
          radial-gradient(40% 35% at 20% 30%, #00e1ff22, transparent 70%),
          radial-gradient(35% 40% at 80% 20%, #8b5cf622, transparent 70%),
          radial-gradient(45% 45% at 50% 80%, #22c55e22, transparent 75%);
        animation: drift 25s ease-in-out infinite alternate;
        filter: blur(60px) saturate(140%);
        transform: translateZ(0);
      }
      @keyframes drift {
        0% { transform: translate(-5%, -2%) scale(1.05) rotate(0deg); }
        100%{ transform: translate(4%, 3%) scale(1.1)  rotate(10deg); }
      }
      /* subtle grain */
      .grain {
        position: fixed; inset: 0; z-index: -2; pointer-events: none;
        background-image: url('data:image/svg+xml;utf8,\
<svg xmlns="http://www.w3.org/2000/svg" width=\"120\" height=\"120\" viewBox=\"0 0 120 120\">\
<filter id=\"n\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"0.9\" numOctaves=\"2\" stitchTiles=\"stitch\"/></filter>\
<rect width=\"120\" height=\"120\" filter=\"url(%23n)\" opacity=\"0.05\"/></svg>');
        mix-blend-mode: overlay;
      }
      /* particles canvas */
      #bgCanvas { position: fixed; inset: 0; z-index: -1; display: block; }

      /* ===== App layout ===== */
      .wrap {
        height: 100%;
        display: grid;
        grid-template-rows: auto 1fr auto;
      }

      .topbar {
        display: flex; gap: 10px; align-items: center; justify-content: space-between;
        padding: 14px 18px;
      }
      .brand { font-weight: 700; letter-spacing: .2px; }
      .actions { display: flex; gap: 8px; align-items: center; }
      .chip {
        padding: 6px 10px; border-radius: 999px; border: 1px solid var(--border);
        background: var(--chip); font-size: 13px;
      }
      .btn {
        appearance: none; border: 0; color: #fff; background: var(--btn);
        padding: 8px 12px; border-radius: 10px; cursor: pointer; font-weight: 700;
      }
      .btn:hover { background: var(--btn-hover); }
      .toggle { background: transparent; color: var(--text); border: 1px solid var(--border); }

      .card {
        max-width: 900px; margin: 0 auto; width: 100%;
        background: var(--card); border: 1px solid var(--border); border-radius: 16px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(8px) saturate(120%);
      }
      .card-header { padding: 18px 20px 0; }
      .note { margin: 6px 20px 12px; color: var(--muted); }

      #log {
        margin: 0 20px; padding: 16px; border-radius: 12px; min-height: 320px; max-height: 58vh;
        overflow: auto; background: rgba(255,255,255,.5);
        border: 1px dashed var(--border);
      }
      html[data-theme="dark"] #log { background: rgba(0,0,0,.2); }

      .row { line-height: 1.6; margin: 0 0 10px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; white-space: pre-wrap; }
      .user { color: var(--user); }
      .bot  { color: var(--bot); }
      .sys  { color: var(--muted); font-style: italic; }

      .toolbar {
        display: flex; gap: 10px; align-items: center; padding: 8px 20px 16px; color: var(--muted);
      }
      .right { margin-left: auto; }
      .hidden { display: none; }

      form {
        display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 16px; border-top: 1px solid var(--border);
        background: transparent; border-radius: 0 0 16px 16px;
      }
      textarea {
        padding: 12px; border: 1px solid var(--border); border-radius: 12px; resize: vertical; min-height: 56px;
        background: rgba(255,255,255,.7); color: var(--text); outline: none;
      }
      html[data-theme="dark"] textarea { background: rgba(0,0,0,.25); }
      textarea:focus { box-shadow: 0 0 0 3px rgba(37,99,235,.15); border-color: #93c5fd; }

      button.send {
        padding: 12px 16px; border-radius: 12px; background: var(--btn); color:#fff; font-weight: 800; border: 0; cursor: pointer;
      }
      button.send:hover { background: var(--btn-hover); }
      button:disabled, textarea:disabled { opacity: .6; cursor: not-allowed; }

      .statusbar {
        display: flex; gap: 12px; align-items: center; padding: 8px 18px; font-size: 13px; color: var(--muted);
      }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #34d399; display: inline-block; margin-right: 6px; }
      .dot.warn { background: #f59e0b; }

      /* Motion preference */
      @media (prefers-reduced-motion: reduce) {
        .bg::before { animation: none; }
      }
      html[data-motion="off"] .bg::before { animation: none; }
      html[data-motion="off"] #bgCanvas { display: none; }
    </style>
  </head>
  <body>
    <!-- Background layers -->
    <div class="bg"></div>
    <canvas id="bgCanvas"></canvas>
    <div class="grain"></div>

    <div class="wrap">
      <div class="topbar">
        <div class="brand">Cloudflare AI Chat</div>
        <div class="actions">
          <span class="chip" id="latency">Edge · ready</span>
          <button class="toggle" id="themeBtn" title="Toggle dark/light">🌙</button>
          <button class="toggle" id="motionBtn" title="Toggle motion">🎞️</button>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h3 style="margin:0 0 4px">Talk to Workers AI</h3>
        </div>
        <p class="note">Per-session memory via Durable Object. Shift+Enter for newline.</p>

        <div id="log" aria-live="polite"></div>

        <div class="toolbar">
          <span id="status" class="hidden">typing…</span>
          <span class="right">
            <button class="toggle" id="clear" type="button" title="Clear chat (local only)">🧹 Clear</button>
          </span>
        </div>

        <form id="f" autocomplete="off">
          <textarea id="m" placeholder="Say something…" autofocus></textarea>
          <button class="send" id="send">Send</button>
        </form>
      </div>

      <div class="statusbar">
        <span><span class="dot"></span><strong>Workers</strong> AI connected</span>
        <span id="net" class="hidden"><span class="dot warn"></span>network issue</span>
      </div>
    </div>

    <script>
      /* ===== Theme + Motion ===== */
      const themeBtn = document.getElementById('themeBtn');
      const motionBtn = document.getElementById('motionBtn');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const savedTheme = localStorage.getItem('theme');
      const savedMotion = localStorage.getItem('motion');
      if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
      else document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
      if (savedMotion) document.documentElement.setAttribute('data-motion', savedMotion);

      themeBtn.addEventListener('click', () => {
        const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        themeBtn.textContent = next === 'dark' ? '🌙' : '☀️';
      });
      motionBtn.addEventListener('click', () => {
        const next = document.documentElement.getAttribute('data-motion') === 'on' ? 'off' : 'on';
        document.documentElement.setAttribute('data-motion', next);
        localStorage.setItem('motion', next);
      });

      /* ===== Interactive particles (lightweight) ===== */
      const canvas = document.getElementById('bgCanvas');
      const ctx = canvas.getContext('2d', { alpha: true });
      let W = canvas.width = window.innerWidth;
      let H = canvas.height = window.innerHeight;
      let mouse = { x: W/2, y: H/2 };
      const PARTICLES = 80; // keep lightweight
      const SPEED = 0.4;
      const dots = Array.from({length: PARTICLES}, () => ({
        x: Math.random()*W, y: Math.random()*H,
        vx: (Math.random()-0.5)*SPEED, vy: (Math.random()-0.5)*SPEED,
        r: Math.random()*1.4 + 0.6
      }));

      function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
      window.addEventListener('resize', resize);
      window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });

      function step() {
        if (document.documentElement.getAttribute('data-motion') === 'off') return; // paused
        ctx.clearRect(0,0,W,H);
        for (const d of dots) {
          // gentle pull towards mouse
          const dx = (mouse.x - d.x) * 0.0008;
          const dy = (mouse.y - d.y) * 0.0008;
          d.vx += dx; d.vy += dy;
          d.x += d.vx; d.y += d.vy;

          // wrap
          if (d.x < -5) d.x = W+5; else if (d.x > W+5) d.x = -5;
          if (d.y < -5) d.y = H+5; else if (d.y > H+5) d.y = -5;

          // draw
          ctx.beginPath();
          ctx.arc(d.x, d.y, d.r, 0, Math.PI*2);
          ctx.fillStyle = 'rgba(255,255,255,0.7)';
          if (document.documentElement.getAttribute('data-theme') === 'light') {
            ctx.fillStyle = 'rgba(0,0,0,0.12)';
          }
          ctx.fill();
        }
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);

      /* ===== Chat logic (unchanged) ===== */
      const log = document.getElementById('log');
      const form = document.getElementById('f');
      const input = document.getElementById('m');
      const sendBtn = document.getElementById('send');
      const statusEl = document.getElementById('status');
      const clearBtn = document.getElementById('clear');
      const netEl = document.getElementById('net');

      const LS_KEY = 'cf_ai_edge_chat_log';
      try { (JSON.parse(localStorage.getItem(LS_KEY) || '[]') || []).forEach(({role, text}) => append(role, text)); } catch {}

      function saveLog() {
        const rows = Array.from(log.querySelectorAll('.row')).map(p => {
          const isUser = p.classList.contains('user');
          const isBot  = p.classList.contains('bot');
          const role = isUser ? 'user' : (isBot ? 'bot' : 'sys');
          const text = p.dataset.raw || p.textContent.replace(/^You:\s|^Bot:\s/, '');
          return { role, text };
        });
        localStorage.setItem(LS_KEY, JSON.stringify(rows.slice(-200)));
      }

      function append(role, text) {
        const p = document.createElement('div');
        p.className = `row ${role}`;
        p.dataset.raw = text;
        p.textContent = (role === 'user' ? 'You: ' : role === 'bot' ? 'Bot: ' : '') + text;
        log.appendChild(p);
        log.scrollTop = log.scrollHeight;
        saveLog();
      }

      function setLoading(loading) {
        input.disabled = loading;
        sendBtn.disabled = loading;
        statusEl.classList.toggle('hidden', !loading);
      }

      clearBtn.addEventListener('click', () => {
        log.innerHTML = '';
        saveLog();
        input.focus();
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendBtn.click();
        }
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;

        append('user', text);
        input.value = '';
        setLoading(true);
        netEl.classList.add('hidden');

        const started = performance.now();
        try {
          const r = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ message: text })
          });
          let data = null;
          try { data = await r.json(); } catch {}

          if (!r.ok) {
            append('sys', `Server error (${r.status})${data?.error ? ': ' + data.error : ''}`);
          } else {
            const ms = Math.max(1, Math.round(performance.now() - started));
            document.getElementById('latency').textContent = `Edge · ${ms} ms`;
            append('bot', data?.reply || '(no reply)');
          }
        } catch {
          netEl.classList.remove('hidden');
          append('sys', 'Network error. Please try again.');
        } finally {
          setLoading(false);
          input.focus();
        }
      });
    </script>
  </body>
</html>
